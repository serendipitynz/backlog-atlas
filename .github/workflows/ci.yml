name: CI

# Every pull request, and `main` after one lands. The second is not redundant with the first:
# branch protection leaves an administrator able to merge past a failing check, and a
# push-triggered run is what states that on `main` rather than leaving it in a closed pull
# request nobody reopens.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref cancels the run still going for the older one, whose verdict is
# about code nobody is going to merge — true of a pull request, and not of `main`. Every push to
# `main` shares one group key, so cancelling there would let a `Done` commit (Task state puts
# those straight on `main`, two of them for this workflow's own pull request) kill the run of the
# merge commit ahead of it, leaving that commit with no verdict at all — which is the one job the
# push trigger exists to do.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version is written here. The pin is `packageManager` in package.json, which this
      # action reads, and `.node-version`, which setup-node reads — one pin per tool, with
      # nowhere for a second one to drift (AGENTS.md Toolchain). `release.yml` does the same.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # `--frozen-lockfile` so a pull request that edited package.json without regenerating the
      # lockfile fails here rather than resolving to something no other machine will resolve to.
      - run: pnpm install --frozen-lockfile

      # Ordered cheapest first, and each is a separate step so the run names which one failed
      # without anyone opening the log.
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm test

      # The build is a check in its own right: `pnpm test` runs modules through Vitest's
      # transform, which is not the same pass as the production one, and a release that first
      # discovers a build error at tag time discovers it with no pull request left to fix.
      - run: pnpm run build

  rust:
    name: rust (${{ matrix.platform }})
    strategy:
      # Windows finding something is worth knowing even after macOS has already failed, and the
      # two share no state.
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # `@stable` resolves to whatever stable is on the day the job runs, so a clippy or rustfmt
      # release can redden both required checks for code nobody touched — decision-32 §4 pins
      # Biome exactly for that very reason, and this is the deliberate asymmetry. Pinning here
      # alone would make the merge requirement test a different compiler from the one
      # `release.yml` ships with, which is worse; decision-33 records the trade and the two
      # things placed instead of a pin.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `--all-targets` so the test code is linted too, and `-D warnings` because a warning that
      # does not fail is a warning nobody reads.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # No Node and no `pnpm run build` on this job. `tauri.conf.json` points `frontendDist` at
      # `../dist`, which a fresh checkout does not have because it is git-ignored — but
      # `tauri-build` only requires it for a bundling build, and `cargo test` was measured
      # passing without it (412 passed, 4 ignored, 2026-08-15). Adding the frontend toolchain
      # here to produce a directory nothing reads would roughly double this job.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # 代表的な利用者操作をアプリ全体で通す GUI E2E (TASK-105, decision-40). Not a merge requirement —
  # the ruleset names three checks and this is deliberately not one of them (decision-40 §5), so a
  # WebKitGTK or driver update reddening it does not block a pull request that did not cause it.
  #
  # **Linux is the only platform this can run on**, which is not what tauri-driver's own README says.
  # It supports Linux and Windows, but only the Linux half reaches a Tauri app: Tauri asks wry to
  # allow automation and wry implements that for webkitgtk alone, so on Windows the WebView2 never
  # opens a debugging port and session creation fails outright. Measured on this repository's own
  # first run of this job — see decision-40.
  #
  # **So this job writes the WebView apt list a third time, and decision-33 §3 refused exactly that.**
  # What changed is not the objection — a third copy is still one nobody re-derives — but what it is
  # weighed against: §3 traded it for one Linux-only `return`, and this trades it for having an
  # automated E2E at all. decision-33's 2026-08-22 revision records the narrowing, doc-13 §3.4 counts
  # the copies, and AGENTS.md Toolchain names all three. Change them together.
  e2e:
    name: e2e (ubuntu-24.04)
    # Pinned like `release.yml`'s Linux job, and for its reason: the WebView is a system library here
    # and which one follows from the lockfile (webkit2gtk-4.1, libsoup-3.0). ubuntu-latest would move.
    runs-on: ubuntu-24.04
    # A backstop, not a budget: this job builds the binary and then drives a real window, and a driver
    # that never answers would otherwise sit until the workflow's own six-hour limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The first seven are README's "Building from source" list, unchanged — the third copy the
      # comment above is about. `webkit2gtk-driver` is this job's own: it provides WebKitWebDriver,
      # which tauri-driver starts. `xvfb` is on the image already and installed anyway, so that what
      # this job needs is written here rather than inferred from an image nobody in this tree pins.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # No version, for the same reason README's install line carries none (decision-27 §7): the
      # command a reader is given fetches the latest, and this job is meant to be what their machine
      # looks like. `npm` rather than `pnpm` for the same reason — README says `npm install -g`.
      # AGENTS.md Toolchain bans npm *in this repository* because it would write a second lockfile;
      # a global install writes nothing here.
      - run: npm install -g backlog.md
      - run: backlog --version

      # `tauri-driver` is a standalone binary with no Rust API, so it is installed rather than
      # depended on; nothing in Cargo.toml could express it.
      - run: cargo install tauri-driver --locked

      # `tauri build`, not `cargo build`. **A plain `cargo build --release` produces a binary that
      # loads `devUrl`** — `tauri`'s own build script sets `dev = !has_feature("custom-protocol")`,
      # and only the Tauri CLI passes that feature (measured: it runs
      # `cargo build --bins --features tauri/custom-protocol --release`). This job's second Linux run
      # died on exactly that: the window came up on `Could not connect to localhost`.
      # `--no-bundle` stops after the binary, and `beforeBuildCommand` builds the frontend, so this
      # one step replaces both. It is the path the product ships through, which is the point — the
      # failure above was caused by re-deriving what this command does.
      - run: pnpm tauri build --no-bundle

      # `xvfb-run` wraps the whole suite rather than the app: tauri-driver, WebKitWebDriver and the
      # window are all started below this process and all need the same DISPLAY.
      - run: xvfb-run -a pnpm run e2e

      # 実 OS 通知の配送検査, Linux's third of it (TASK-108, decision-43). It rides this job rather
      # than the `os-notify` one below because `cargo test` cannot link the crate on Linux until the
      # WebView development packages are installed, and that apt list is copied per job — a Linux
      # `os-notify` would be a **fourth** copy, which decision-33 §3 refused and decision-40 refused
      # again. This job has already paid for the third.
      #
      # It runs last so the E2E's verdict is reached first: both are in one job now, so a red job has
      # two possible causes and the failing step is what names which.
      - run: pnpm run os-notify


  # 実 OS 通知の配送検査 (TASK-108, decision-43) — whether the OS actually delivers a file-change
  # notification to Atlas's watcher. What it asserts on is a property of the platform, not of this
  # crate, which is why the test is `#[ignore]`d out of `cargo test` and named here instead.
  #
  # **Not a merge requirement**, for decision-40 §5's reason: FSEvents or a runner image can change
  # under a pull request that did not cause it. The cost is the same one — a check nothing enforces
  # is a check someone has to read.
  #
  # **Linux is deliberately absent from this matrix** and runs in the `e2e` job above instead; the
  # comment on that step carries why. **Not folded into the `rust` job** either: that job is a merge
  # requirement, and this is exactly the kind of check that must be able to go red without blocking.
  os-notify:
    name: os-notify (${{ matrix.platform }})
    strategy:
      # Each platform has its own notification API (FSEvents, ReadDirectoryChangesW), so the one that
      # has not failed yet is the one worth still hearing from.
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # No `pnpm install`, and no `cache: pnpm` above to key it on: `scripts/os-notify/run.mjs`
      # imports node builtins only. `pnpm run` is still the entry point, because it is the one a
      # reader is told to use and a second spelling of the command is a second place to drift.
      - run: pnpm run os-notify


# Why the `rust` job is macOS and Windows, and deliberately not Linux.
#
# **Coverage.** The crate has exactly one Linux-exclusive line: the
# `not(any(target_os = "macos", target_os = "windows"))` arm of `Platform::current` in
# `editor.rs`, which returns `Platform::Freedesktop`. `src-tauri/src` holds seven distinct
# OS-conditional predicates, and the other six — `unix`, `windows`, `target_os = "windows"`,
# `any(target_os = "windows", test)`, `not(target_os = "windows")`, `target_os = "macos"` — are
# each compiled by one of these two runners, while `Platform::ALL` puts Freedesktop's
# *behaviour* under test on every platform regardless. What a Linux runner would add is the
# compilation of one `return`.
#
# **Cost of the alternative.** A Linux runner cannot link the crate until it has
# `apt-get install`ed the WebView development packages, and that list is copied per job — so a
# Linux `rust` job would be a *fourth* copy, after README's "Building from source",
# `release.yml`, and the `e2e` job above. AGENTS.md Toolchain says to change them together, and
# each further copy is one more nobody re-derives. **The `e2e` job paying that price does not
# make it free here**: it pays it because it cannot run anywhere else at all (decision-40),
# where this would buy the compilation of one `return`.
#
# The Linux bundle is still built on every `v*` tag by `release.yml`.
