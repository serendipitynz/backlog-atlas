[package]
name = "backlog-atlas"
version = "0.1.0"
description = "Backlog Atlas — a multi-root Backlog.md client"
authors = ["Takuya Otani"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name; without it the
# two collide on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "backlog_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# serde stays as the IPC foundation: Tauri command arguments and return values are
# (de)serialized through it, so every future command depends on it. serde_json and
# any further crates (parser, Git, file watcher, editor launch) are deferred to the
# tasks that need them, introduced with rationale per AGENTS.
serde = { version = "1", features = ["derive"] }
# toml reads/writes the project ledger (projects.toml, doc-3). Paired with serde
# for typed (de)serialization; scope is limited to the ledger file. Approved as a
# new production dependency per the TASK-25 introduction gate before adding.
toml = "0.8"
# serde_yaml_ng parses the YAML frontmatter of Backlog management files and config.yml
# (doc-4 §4). A maintained fork of the now-archived serde_yaml, kept because YAML validity
# itself is a required signal here: doc-4 §5 makes "frontmatter が YAML として読めない" a
# distinct 解析不能 event, so a hand-rolled subset parser that silently mis-reads a
# hand-edited file would be worse than a dependency. Scope is limited to the read layer.
# Approved as a new production dependency per the AGENTS.md introduction gate before adding.
serde_yaml_ng = "0.10"
# notify subscribes to the OS file-change notifications for a Backlog root (doc-9 §3, AC #1):
# FSEvents / inotify / ReadDirectoryChangesW behind one cross-platform API. doc-9 §7 defers the
# watcher crate choice to implementation and requires confirming it before adding; notify is the
# de-facto standard (cargo-watch, rust-analyzer) and the confirmed choice. Scope is limited to the
# `sync` module's concrete watcher (WatchSession); the read-version index, conflict detection,
# reload path, and debounce logic depend on none of it and stay unit-testable without a real
# watcher. Approved as a new production dependency per the AGENTS.md introduction gate before adding;
# the selection rationale and rejected alternatives are recorded in decision-11.
notify = "8"
# tauri-plugin-dialog opens the OS folder picker for 台帳への登録 (doc-3 §4.1 step 1: the user
# names a project root / Backlog root). A picker rather than a typed absolute path because the
# value has to be an existing absolute directory — doc-3 §3 — and a hand-typed one is wrong far
# more often than it is right, with 登録拒否 as the only feedback. Official Tauri plugin, so it
# adds no new vendor. Scope is limited to selecting those two paths: the plugin's other dialogs
# (ask/confirm/message/save) stay unused, and the capability grants `dialog:allow-open` alone.
# Nothing is read or written through it — the returned path is a *string* that travels to the
# ledger commands, which keeps 台帳ファイルの読み書きは Atlas が行う (doc-3 §2.1) intact.
# Approved as a new production dependency per the AGENTS.md introduction gate before adding.
tauri-plugin-dialog = "2"

[dev-dependencies]
# Test-only: asserts the domain model's JSON wire contract (doc-4 §3.1 camelCase field
# names, enum tokens). Already present transitively via tauri, so it adds no new build;
# scope is limited to unit tests and it is not a production dependency.
serde_json = "1"
